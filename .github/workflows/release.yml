# main 에 코드가 올라오면: 프로젝트 파일의 버전(<Version>)을 읽어서
# 그 버전의 릴리스가 아직 없을 때만 윈도우에서 시험 → exe 빌드 → 태그와 릴리스를 만든다.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 확인
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/MessengerSync/MessengerSync.csproj -Encoding UTF8
          $v = @($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          $tag = "v$v"
          $exists = [bool](git tag -l $tag)
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "$tag 릴리스가 이미 있어 건너뜁니다." } else { Write-Host "$tag 릴리스를 만듭니다." }

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          dotnet-version: '8.0.x'

      - name: 동기화 로직 시험
        if: steps.ver.outputs.exists == 'false'
        run: dotnet run --project tests/CoreTests -c Release

      - name: exe 빌드
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          dotnet publish src/MessengerSync -c Release -o dist
          Get-ChildItem docs -Filter *.txt | Copy-Item -Destination dist
          $hash = (Get-FileHash dist/MessengerSync.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/MessengerSync.exe.sha256 -Value $hash -NoNewline
          $files = @('dist/MessengerSync.exe') + (Get-ChildItem dist -Filter *.txt | ForEach-Object { $_.FullName })
          Compress-Archive -Path $files -DestinationPath "dist/MessengerSync-$tag.zip"
          # 릴리스 설명: CHANGELOG.md 에서 이 버전 부분만
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l.StartsWith('## ') -and $l.Contains($tag) })
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Length -and -not $lines[$i].StartsWith('## '); $i++) { $notes += $lines[$i] }
          }
          ($notes -join "`n").Trim() | Set-Content -Path dist/notes.md -Encoding UTF8

      - name: 릴리스 등록
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: dist/notes.md
          make_latest: true
          files: |
            dist/MessengerSync.exe
            dist/MessengerSync.exe.sha256
            dist/MessengerSync-${{ steps.ver.outputs.tag }}.zip
